
<!DOCTYPE html>
<html lang="id" data-theme="light" data-palette="ocean">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SaltCare{% endblock %}</title>

    <meta name="description"
          content="SaltCare, prototipe sistem prediksi hipertensi berbasis machine learning dan SHAP.">

    <meta name="theme-color" content="#f5f9f8">

    <!-- Pulihkan preferensi tema dan warna sebelum halaman ditampilkan -->
    <script>
        (function () {
            try {
                const theme = localStorage.getItem("saltcare-theme");
                const palette = localStorage.getItem("saltcare-palette");

                document.documentElement.setAttribute(
                    "data-theme",
                    theme === "dark" ? "dark" : "light"
                );

                const validPalettes = [
                    "ocean", "mint", "lavender",
                    "rose", "sunset", "teal"
                ];

                document.documentElement.setAttribute(
                    "data-palette",
                    validPalettes.includes(palette) ? palette : "ocean"
                );
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "light");
                document.documentElement.setAttribute("data-palette", "ocean");
            }
        })();
    </script>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- CSS utama SaltCare -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <!-- CSS animasi SaltCare -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/animations.css') }}">

    {% block head %}{% endblock %}
</head>

<body>
    <!-- Dekorasi latar -->
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-salt sticky-top">
        <div class="container">

            <!-- Brand -->
            <a class="navbar-brand fw-bold"
               href="{{ url_for('main.index') }}">
                <span class="brand-icon" aria-hidden="true">♡</span>
                SaltCare
            </a>

            <!-- Tombol navigasi mobile -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu navigasi -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('main.index') }}">
                            <i class="bi bi-house-door me-1"
                               aria-hidden="true"></i>
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('prediction.prediction') }}">
                            <i class="bi bi-activity me-1"
                               aria-hidden="true"></i>
                            Prediksi
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('prediction.history') }}">
                            <i class="bi bi-clock-history me-1"
                               aria-hidden="true"></i>
                            Riwayat
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('main.dashboard') }}">
                            <i class="bi bi-bar-chart-line me-1"
                               aria-hidden="true"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('main.education') }}">
                            <i class="bi bi-book me-1"
                               aria-hidden="true"></i>
                            Edukasi
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('main.about') }}">
                            <i class="bi bi-info-circle me-1"
                               aria-hidden="true"></i>
                            Tentang
                        </a>
                    </li>

                    <!-- Pengaturan tema -->
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <button
                            class="theme-toggle"
                            id="themeToggle"
                            type="button"
                            aria-label="Aktifkan dark mode"
                            aria-pressed="false"
                            title="Ganti tema">

                            <i class="bi bi-moon-stars-fill"
                               id="themeIcon"
                               aria-hidden="true"></i>

                            <span class="theme-toggle-label"
                                  id="themeLabel">Dark Mode</span>
                        </button>
                    </li>

                    <!-- Pemilih warna -->
                    <li class="nav-item mt-2 mt-lg-0">
                        <div class="palette-picker">

                            <button
                                type="button"
                                class="palette-toggle"
                                id="paletteToggle"
                                aria-expanded="false"
                                aria-controls="palettePanel"
                                title="Pilih warna tema">

                                <i class="bi bi-palette-fill"
                                   aria-hidden="true"></i>
                                <span>Warna Tema</span>
                            </button>

                            <div class="palette-panel"
                                 id="palettePanel"
                                 hidden>

                                <div class="palette-heading">
                                    <strong>Pilih warna tema</strong>
                                    <span>Personalisasi SaltCare</span>
                                </div>

                                <div class="palette-options">

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="ocean"
                                            aria-pressed="true">
                                        <span class="palette-swatch"
                                              style="--swatch:#3268F5"></span>
                                        <span>Ocean Blue</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="mint"
                                            aria-pressed="false">
                                        <span class="palette-swatch"
                                              style="--swatch:#159B79"></span>
                                        <span>Mint Green</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="lavender"
                                            aria-pressed="false">
                                        <span class="palette-swatch"
                                              style="--swatch:#8B5CF6"></span>
                                        <span>Lavender</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="rose"
                                            aria-pressed="false">
                                        <span class="palette-swatch"
                                              style="--swatch:#E65381"></span>
                                        <span>Rose Pink</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="sunset"
                                            aria-pressed="false">
                                        <span class="palette-swatch"
                                              style="--swatch:#EA8536"></span>
                                        <span>Sunset Orange</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                    <button type="button"
                                            class="palette-option"
                                            data-palette="teal"
                                            aria-pressed="false">
                                        <span class="palette-swatch"
                                              style="--swatch:#0D9488"></span>
                                        <span>Teal</span>
                                        <i class="bi bi-check-circle-fill palette-check"
                                           aria-hidden="true"></i>
                                    </button>

                                </div>
                            </div>
                        </div>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten halaman -->
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer-salt">
        <div class="container d-flex flex-column flex-md-row
                    justify-content-between gap-2">
            <span>
                <span aria-hidden="true">♡</span> SaltCare
            </span>

            <span>
                Prototipe penelitian machine learning dan SHAP
            </span>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript utama SaltCare -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Pengelola enam pilihan warna -->
    <script src="{{ url_for('static', filename='js/theme-palette.js') }}"></script>

    <!-- JavaScript khusus halaman -->
    {% block scripts %}{% endblock %}
</body>
</html>
